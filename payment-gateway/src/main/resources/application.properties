spring.application.name=payment-gateway
server.port=8081

# ledger-service and our own /payments API both use snake_case JSON fields
spring.jackson.property-naming-strategy=SNAKE_CASE

# Downstream ledger-service
ledger-service.base-url=${LEDGER_SERVICE_BASE_URL:http://localhost:8080}
ledger-service.connect-timeout-ms=2000
ledger-service.read-timeout-ms=5000

# Redis (idempotency key storage)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Idempotency cache TTL
payment-gateway.idempotency.ttl-hours=24
